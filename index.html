<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumeeth HB</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── Dark mode (default) ── */
      :root {
        --bg: #000;
        --fg: #e8e8e8;
        --fg-heading: #fff;
        --fg-meta: #bbb;
        --fg-dot: #555;
        --fg-date: #666;
        --fg-desc: #777;
        --fg-about: #aaa;
        --fg-footer: #444;
        --fg-footer-hv: #888;
        --link-color: #e8e8e8;
        --link-dec: #555;
        --link-hv: #fff;
        --link-dec-hv: #aaa;
        --hr-color: #333;
        --toggle-bg: #1a1a1a;
        --toggle-border: #333;
        --toggle-fg: #888;
        --toggle-hv: #bbb;
      }

      /* ── Light mode ── */
      body.light {
        --bg: #fafafa;
        --fg: #1a1a1a;
        --fg-heading: #000;
        --fg-meta: #555;
        --fg-dot: #bbb;
        --fg-date: #999;
        --fg-desc: #888;
        --fg-about: #555;
        --fg-footer: #bbb;
        --fg-footer-hv: #666;
        --link-color: #1a1a1a;
        --link-dec: #bbb;
        --link-hv: #000;
        --link-dec-hv: #666;
        --hr-color: #ddd;
        --toggle-bg: #f0f0f0;
        --toggle-border: #ddd;
        --toggle-fg: #999;
        --toggle-hv: #444;
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Monaco,
          "Cascadia Mono", "Liberation Mono", monospace;
        font-size: 13px;
        min-height: 100vh;
        padding: 60px 0 40px 0;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .container {
        max-width: 820px;
        margin: 0 auto;
        padding: 0 40px;
      }

      /* ── Theme toggle ── */
      .theme-toggle {
        position: fixed;
        top: 24px;
        right: 32px;
        background: var(--toggle-bg);
        border: 1px solid var(--toggle-border);
        color: var(--toggle-fg);
        font-family:
          "SF Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
        transition:
          color 0.15s,
          border-color 0.15s,
          background 0.2s;
        letter-spacing: 0.04em;
      }

      .theme-toggle:hover {
        color: var(--toggle-hv);
        border-color: var(--toggle-hv);
      }

      /* ── Header ── */
      .name {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.2rem;
        font-weight: normal;
        font-style: italic;
        color: var(--fg-heading);
        margin-bottom: 28px;
      }

      .meta-line {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--fg-meta);
        margin-bottom: 10px;
        font-size: 13px;
        font-family:
          "SF Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
      }

      .meta-line .dot {
        color: var(--fg-dot);
      }

      .tags-line {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--fg-meta);
        margin-bottom: 20px;
        font-size: 13px;
        font-family:
          "SF Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
      }
